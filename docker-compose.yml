version: '3.8'

services:
  # 1. Drupal Admin CMS
  # Backend đã deploy lên Railway → Drupal chỉ cần kết nối ra ngoài qua URL Railway
  # Không cần depends_on: backend nữa
  drupal:
    image: drupal:10-apache
    ports:
      - "8080:80"
    volumes:
      - ./admin_cms/web/modules/custom/ai_translator_admin:/opt/drupal/web/modules/custom/ai_translator_admin
    depends_on:
      - drupal_db

  # 2. Database nhỏ xíu (MariaDB) chỉ để nuôi thằng Drupal
  drupal_db:
    image: mariadb:10.11
    environment:
      - MYSQL_DATABASE=drupal
      - MYSQL_USER=drupal
      - MYSQL_PASSWORD=drupal
      - MYSQL_ROOT_PASSWORD=root

  # 3. Backend FastAPI → ĐÃ DEPLOY LÊN RAILWAY
  # Không còn build local nữa.
  # Cấu hình kết nối trong Drupal Settings tại:
  #   http://localhost:8080/admin/config/ai-translator/settings
  #   FastAPI Base URL = https://ai-translator-system-production.up.railway.app
  #   API Key          = hle25zepezevide

  # 4. Superset Analytics Dashboard
  superset:
    build:
      context: ./using_superset/superset
    ports:
      - "8088:8088"
    volumes:
      - ./using_superset/superset_config/superset_config.py:/app/pythonpath/superset_config.py
      - ./using_superset/superset_home:/app/superset_home
      - ./using_superset/superset_config/auto_import.py:/app/auto_import.py
    command: bash -c "python /app/auto_import.py & gunicorn --bind 0.0.0.0:8088 --worker-class gthread --threads 20 --timeout 60 --limit-request-line 0 --limit-request-field_size 0 'superset.app:create_app()'"
