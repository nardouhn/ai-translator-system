version: '3.8'

services:
  # 1. Drupal Admin CMS
  drupal:
    image: drupal:10-apache
    ports:
      - "8080:80"
    volumes:
      # Mount thư mục code module của má vào trong container
      - ./admin_cms/web/modules/custom/ai_translator_admin:/opt/drupal/web/modules/custom/ai_translator_admin
    depends_on:
      - drupal_db
      - backend

  # 2. Database nhỏ xíu (MariaDB) chỉ để nuôi thằng Drupal
  drupal_db:
    image: mariadb:10.11
    environment:
      - MYSQL_DATABASE=drupal
      - MYSQL_USER=drupal
      - MYSQL_PASSWORD=drupal
      - MYSQL_ROOT_PASSWORD=root

  # 3. Backend FastAPI của má (Trái tim hệ thống)
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Credentials thật của team - đồng bộ từ cloud_credentials_for_team.txt
