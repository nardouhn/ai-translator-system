ai_translator_admin.dashboard:
  path: '/admin/config/ai-translator/dashboard'
  defaults:
    _controller: '\Drupal\ai_translator_admin\Controller\DashboardController::build'
    _title: 'AI Translator Dashboard'
  requirements:
    _permission: 'administer site configuration'

ai_translator_admin.clear_cache:
  path: '/admin/config/ai-translator/clear-cache'
  defaults:
    _form: '\Drupal\ai_translator_admin\Form\ClearCacheForm'
    _title: 'Clear Upstash Redis Cache'
  requirements:
    _permission: 'administer site configuration'

ai_translator_admin.settings:
  path: '/admin/config/ai-translator/settings'
  defaults:
    _form: '\Drupal\ai_translator_admin\Form\SettingsForm'
    _title: 'AI Translator Settings'
  requirements:
    _permission: 'administer site configuration'

ai_translator_admin.file_audit:
  path: '/admin/ai-translator/files/{file_id}/audit'
  defaults:
    _controller: '\Drupal\ai_translator_admin\Controller\FileAuditController::viewSegments'
    _title_callback: '\Drupal\ai_translator_admin\Controller\FileAuditController::title'
  requirements:
    _permission: 'administer site configuration'
    file_id: '\w+'
