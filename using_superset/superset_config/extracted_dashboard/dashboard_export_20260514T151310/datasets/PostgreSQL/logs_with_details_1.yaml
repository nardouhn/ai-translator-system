schema: ''
sql: "SELECT\r\n    l.log_id,\r\n    l.session_id,\r\n    l.request_type,\r\n    l.status,\r\
  \n    l.request_time,\r\n    l.completed_time,\r\n    l.ip_address,\r\n    l.translation_id,\r\
  \n    l.file_id,\r\n    t.model_name,\r\n    d.domain_name,\r\n    f.error_message\
  \ AS file_error_message\r\nFROM logs l\r\nLEFT JOIN translation t ON l.translation_id\
  \ = t.trans_id\r\nLEFT JOIN file f ON l.file_id = f.file_id\r\nLEFT JOIN domain\
  \ d ON (\r\n    (l.translation_id IS NOT NULL AND d.domain_id = t.domain_id)\r\n\
  \    OR\r\n    (l.file_id IS NOT NULL AND d.domain_id = f.domain_id)\r\n)"
